baseURL: "https://blog.sekixu.dev/"
languageCode: "zh-tw"
title: "SekiXu Dev Note"
theme: ["PaperMod"]

buildDrafts: false

params:
  title: SekiXu Dev Note
  description: "SekiXu 的開發筆記：前端、後端、架構、基礎設施與開源專案的學習紀錄。"
  keywords: [React, Flask, Terraform, Traefik, GitHub Actions, Gravitino]
  author: SekiXu
  # author: ["Me", "You"] # multiple authors
  DateFormat: "2006-01-02"
  defaultTheme: dark # dark, light, auto
  disableThemeToggle: false

  ShowReadingTime: false
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  # SX icons copied from sekixu.dev (sekixu-dev/public)
  assets:
    favicon: "favicon.svg"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
    safari_pinned_tab: "favicon.svg"

  label:
    text: "SekiXu Dev Note"
    icon: /apple-touch-icon.png
    iconHeight: 35

  # home-info mode
  homeInfoParams:
    Title: "SekiXu Dev Note"
    Content: "Hi, i'm SekiXu, a software engineer. I write some notes about programming, technology, and life. Hope you like it."

  socialIcons:
    - name: github
      url: "https://github.com/antony0016/"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: sekixu-dev
      name: sekixu.dev
      url: https://sekixu.dev/
      weight: 30